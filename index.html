<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Yasowant Nayak | Full Stack Software Developer</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Yasowant Nayak is a Full Stack Software Developer specializing in scalable web applications, REST APIs, and clean backend systems using React, Node.js, MongoDB, and PostgreSQL."
    />
    <meta name="author" content="Yasowant Nayak" />
    <meta
      name="keywords"
      content="Yasowant Nayak, Full Stack Developer, Software Engineer, React Developer, Node.js Developer, Backend Developer, Web Developer India"
    />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://yasowant.dev" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta
      property="og:title"
      content="Yasowant Nayak | Full Stack Software Developer"
    />
    <meta
      property="og:description"
      content="Building scalable web applications and high-performance backend systems with modern technologies."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yasowant.dev" />
    <meta property="og:image" content="https://yasowant.dev/og-image.png" />
    <meta property="og:site_name" content="Yasowant Nayak" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Yasowant Nayak | Full Stack Software Developer"
    />
    <meta
      name="twitter:description"
      content="Full Stack Developer building scalable, secure, and high-performance web applications."
    />
    <meta name="twitter:image" content="https://yasowant.dev/og-image.png" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Yasowant Nayak",
        "url": "https://yasowant.dev",
        "jobTitle": "Full Stack Software Developer",
        "sameAs": [
          "https://github.com/yasowant",
          "https://www.linkedin.com/in/yasowant-nayak"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
